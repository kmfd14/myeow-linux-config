### Session autostart
# Idle lock / DPMS (swayidle package installed by install.sh)
exec swayidle -w \
    timeout 300 'swaylock -f -c 1e1e2e' \
    timeout 600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep 'swaylock -f -c 1e1e2e'

# Polkit auth agent (mounts, NetworkManager, package prompts)
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Secret service for browsers / SSH helpers
exec gnome-keyring-daemon --start --components=secrets
