### Variables
# Logo / Super key = Windows key
set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term kitty
set $browser "flatpak run com.brave.Browser"

# Default launcher (overridden by ~/.config/sway/menu.conf from install.sh)
set $menu "bash $HOME/.config/rofi/launchers/type-7/launcher.sh"
