# myeow Hyprland — work binds aligned with SwayFX rice
# Desktop shell / shell=none tray: shell.conf (install.sh)

$mod = SUPER
$term = kitty
$menu = bash $HOME/.config/rofi/launchers/type-7/launcher.sh
$browser = flatpak run com.brave.Browser
$powermenu = bash $HOME/.config/rofi/powermenu/type-3/powermenu.sh

monitor=,preferred,auto,1

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 0
}

decoration {
    rounding = 8
}

input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

bind = $mod, Return, exec, $term
bind = $mod, T, exec, $term
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, thunar
bind = $mod, W, exec, $browser
bind = $mod, C, exec, cursor
bind = $mod, A, exec, pavucontrol
bind = $mod, X, exec, $powermenu
bind = $mod SHIFT, P, exec, $HOME/.local/bin/cycle-power-profile.sh
bind = $mod, L, exec, swaylock -f -c 1e1e2e

bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim - | wl-copy

bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mod SHIFT, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen,
bind = $mod SHIFT, Space, togglefloating,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
# L is lock on Hyprland (matches Sway); use arrows for right focus

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Shell autostart snippet (generated at install time)
source = ~/.config/hypr/shell.conf
