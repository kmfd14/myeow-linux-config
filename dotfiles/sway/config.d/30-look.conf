### SwayFX look (end-4 inspired: gaps, rounding, blur, shadows, dim)
# Requires SwayFX — stock sway ignores unknown directives with a warning.

gaps inner 4
gaps outer 5

default_border pixel 1
default_floating_border pixel 1
# Catppuccin Frappé (matches Kitty)
#              border    background text     indicator child_border
client.focused          #ca9ee6 #303446 #c6d0f5 #ca9ee6 #ca9ee6
client.focused_inactive #51576d #292c3c #a5adce #51576d #51576d
client.unfocused        #414559 #232634 #737994 #414559 #414559
client.urgent           #e78284 #303446 #c6d0f5 #e78284 #e78284

corner_radius 18

blur enable
blur_xray enable
blur_passes 2
blur_radius 10
blur_noise 0.05
blur_brightness 1.0
blur_contrast 0.9
blur_saturation 1.0

shadows enable
shadow_blur_radius 20
shadow_color #00000033
shadow_offset 0 2
shadow_inactive_color #00000022

default_dim_inactive 0.05
dim_inactive_colors.unfocused #232634FF
dim_inactive_colors.urgent #e78284FF

animation_duration_ms 240

titlebar_separator disable
font pango:JetBrainsMono Nerd Font 10
titlebar_padding 2
titlebar_border_thickness 0
